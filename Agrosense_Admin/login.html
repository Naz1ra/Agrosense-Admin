<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgroSense Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#e6f4ea] h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
        <div class="w-12 h-12 bg-green-500 rounded-lg mx-auto flex items-center justify-center mb-4">
            <span class="text-white text-xl font-bold">A</span>
        </div>
        <h2 class="text-xl font-bold text-gray-800 mb-1">AgroSense Admin</h2>
        <p class="text-xs text-gray-500 mb-6">Sign in to access the admin dashboard</p>
        
        <form onsubmit="login(event)">
            <div class="text-left mb-4">
                <label class="block text-xs font-medium text-gray-600 mb-1">Email Address</label>
                <input type="email" id="emailInput" value="admin@agrosense.com"
                       data-real-value="admin@agrosense.com"
                       placeholder="Enter your email"
                       class="w-full px-3 py-2 border rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-green-500" required>
            </div>
            <div class="text-left mb-2">
                <label class="block text-xs font-medium text-gray-600 mb-1">Password</label>
                <input type="password" id="passwordInput" value="password123"
                       data-real-value="password123"
                       placeholder="Enter your password"
                       class="w-full px-3 py-2 border rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-green-500" required>
            </div>
            
            <div class="text-left mb-6">
                <a href="#" class="text-xs text-green-600 hover:underline">Forgot password?</a>
            </div>
            
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-md transition">Login</button>
        </form>
        
        <p class="text-[10px] text-gray-400 mt-6">Please enter your credentials to continue.</p>
    </div>

    <script>
        // On page load: keep the real values in data-real-value, but blank the visible field
        document.addEventListener("DOMContentLoaded", () => {
            const email = document.getElementById("emailInput");
            const password = document.getElementById("passwordInput");

            email.value = "";
            password.value = "";
        });

        // Before submit: restore the real values so login() receives the correct credentials
        function login(event) {
            const email = document.getElementById("emailInput");
            const password = document.getElementById("passwordInput");

            // If the user didn't type anything, use the stored real value
            if (!email.value) email.value = email.dataset.realValue;
            if (!password.value) password.value = password.dataset.realValue;

            event.preventDefault();
            console.log("Logging in with:", email.value, password.value);

            // Call your existing logic — e.g. window.login? No — this IS login.
            // If your script.js defines a different function, call it here instead.
        }
    </script>

    <script src="script.js"></script>
</body>
</html>
